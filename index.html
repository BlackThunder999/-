<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Загрузка данных...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Динамическая высота под мобильные браузеры */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      text-align: center;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    /* Экран-ловушка */
    #tap-overlay {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      padding: 20px;
    }

    #tap-overlay h2 {
      font-size: clamp(20px, 5.5vw, 28px);
      font-weight: 900;
      color: #00ff66;
      text-transform: uppercase;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.04); opacity: 1; }
    }

    h1 {
      font-size: clamp(20px, 6vw, 34px);
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
      letter-spacing: 0.5px;
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* Блок видео с автоматическим вписыванием по высоте и ширине */
    .video-wrapper {
      flex: 1 1 auto;
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0; /* Предотвращает переполнение flex-контейнера */
      margin: 10px 0;
    }

    .video-box {
      max-height: 100%;
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #ff0055;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
      background: #000;
      display: flex;
    }

    video {
      width: 100%;
      max-height: calc(100dvh - 210px);
      object-fit: contain;
      display: block;
    }

    #stop-btn {
      flex-shrink: 0;
      width: 100%;
      max-width: 320px;
      padding: 14px 20px;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 900;
      color: #fff;
      background: #ff2222;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
      margin-bottom: 5px;
      transition: transform 0.08s ease;
    }

    #stop-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <div id="tap-overlay" onclick="startPrank()">
    <h2>⚡ НАЖМИ, ЧТОБЫ ОТКРЫТЬ ⚡</h2>
    <p style="color: #777; margin-top: 8px; font-size: 14px;">(секретный файл)</p>
  </div>

  <h1>ТЫ ЗАРИКРОЛЕН! 🕺</h1>

  <div class="video-wrapper">
    <div class="video-box">
      <video id="troll-video" loop playsinline preload="auto">
        <source src="ssstik.io_@emagjoke_7581553356724899079.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <button id="stop-btn" onclick="boostSound()">🛑 ОСТАНОВИТЬ 🛑</button>

  <script>
    const video = document.getElementById('troll-video');
    const overlay = document.getElementById('tap-overlay');
    const stopBtn = document.getElementById('stop-btn');

    let audioCtx = null;
    let gainNode = null;
    let boostLevel = 1;

    function startPrank() {
      overlay.style.display = 'none';

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      const source = audioCtx.createMediaElementSource(video);
      gainNode = audioCtx.createGain();

      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      video.volume = 1.0;
      video.play();
    }

    function boostSound() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      boostLevel += 2.5;
      if (gainNode) {
        gainNode.gain.value = boostLevel;
      }

      video.playbackRate = Math.min(video.playbackRate + 0.15, 2.0);

      const phrases = [
        "НЕЛЬЗЯ ОСТАНОВИТЬ! 🔊",
        "ЕЩЁ ГРОМЧЕ! 💀",
        "ТАК И ЗАДУМАНО 😈",
        "БАСБУСТ x" + Math.round(boostLevel)
      ];
      stopBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
      stopBtn.style.background = "#ff0000";
    }
  </script>
</body>
</html>
